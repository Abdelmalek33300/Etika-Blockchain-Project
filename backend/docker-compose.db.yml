version: "3.9"
services:
  postgres:
    image: postgres:16
    container_name: etika-postgres
    environment:
      POSTGRES_USER: etika
      POSTGRES_PASSWORD: etika
      POSTGRES_DB: etika
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etika -d etika"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    container_name: etika-adminer
    depends_on:
      - postgres
    ports:
      - "8080:8080"

volumes:
  pgdata:
